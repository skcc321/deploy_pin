name: verify

on: [pull_request]

env:
  DB_NAME: myapp_db
  DB_USERNAME: runner
  DB_PASSWORD: password

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Due to https://github.com/actions/runner/issues/849, we have to use quotes for '3.0'
        ruby: ["3.3.14", "3.4.13", "4.0.10"]
        db: ["mariadb", "mysql", "pg", "mongodb"]

    runs-on: ${{ matrix.os }}

    services:
      mongodb:
        image: mongo:7
        ports:
          - "27017:27017"

      redis:
        image: redis:7.4-alpine
        ports:
          - "6379:6379"

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - "5432:5432"

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_USER: ${{ env.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppasword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MARIADB_USER: ${{ env.DB_USERNAME }}
          MARIADB_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - "3307:3306"

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      # MySQL/MariaDB client tools
      - name: Install MySQL client
        if: ${{ matrix.db == 'mysql' || matrix.db == 'mariadb' }}
        # The runner image ships MySQL preinstalled; installing the client upgrades
        # mysql-server too, and its postinst fails. Only install when missing.
        run: |
          if ! command -v mysqladmin >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mysql-client
          fi

      - name: Wait for MySQL/MariaDB
        if: ${{ matrix.db == 'mysql' || matrix.db == 'mariadb' }}
        env:
          DB_ENGINE: ${{ matrix.db }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          if [ "$DB_ENGINE" = "mariadb" ]; then
            DB_PORT=3307
          else
            DB_PORT=3306
          fi

          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P "$DB_PORT" -uroot -p"$DB_PASSWORD" --silent; then
              echo "DB ($DB_ENGINE) is up on port $DB_PORT"
              break
            fi
            echo "Waiting for $DB_ENGINE on port $DB_PORT..."
            sleep 2
          done

      - name: Grant privileges to non-root user (MySQL/MariaDB)
        if: ${{ matrix.db == 'mysql' || matrix.db == 'mariadb' }}
        env:
          DB_ENGINE: ${{ matrix.db }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          if [ "$DB_ENGINE" = "mariadb" ]; then
            DB_PORT=3307
          else
            DB_PORT=3306
          fi

          mysql -h 127.0.0.1 -P "$DB_PORT" -uroot -p"$DB_PASSWORD" <<EOSQL
            GRANT CREATE, DROP ON *.* TO '${DB_USERNAME}'@'%';
            GRANT ALL PRIVILEGES ON *.* TO '${DB_USERNAME}'@'%';
            FLUSH PRIVILEGES;
          EOSQL

      - name: Setup test database
        if: ${{ matrix.db != 'mongodb' }}
        env:
          RAILS_ENV: test
          DB_NAME: ${{ env.DB_NAME }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_ROLE: ${{ matrix.db }}
        run: |
          bin/rails db:prepare

      - name: Run tests
        env:
          RAILS_ENV: test
          DB_ROLE: ${{ matrix.db }}
          DB_NAME: ${{ env.DB_NAME }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          bin/test

      # ActiveRecord and Mongoid runs cover different code paths; the coverage job merges both.
      - name: Upload coverage
        if: ${{ (matrix.db == 'pg' || matrix.db == 'mongodb') && matrix.ruby == '3.4.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.db }}
          path: coverage/.resultset.json
          include-hidden-files: true

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.13"
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-parts/
      - name: Merge coverage
        run: |
          bundle exec ruby -e "
            require 'simplecov'
            require 'simplecov-review'
            SimpleCov.collate(Dir['coverage-parts/*/.resultset.json']) do
              formatter SimpleCov::Formatter::ReviewFormatter
            end
          "
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest # Optional. [latest,nightly,v.X.Y.Z]
      - name: coverage
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -reporter=github-pr-review -runners=coverage
