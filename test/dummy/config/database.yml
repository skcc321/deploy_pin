# Only the database of DB_ROLE (pg, mysql or mariadb), as in the Rails app: CI
# runs one engine per job, and MariaDB listens on 3307.
<%
  role = ENV.fetch('DB_ROLE', 'pg')
  mysql = %w[mysql mariadb].include?(role)
%>
default: &default
  adapter: <%= mysql ? 'mysql2' : 'postgresql' %>
  encoding: utf8
  host: 127.0.0.1
  port: <%= { 'mysql' => 3306, 'mariadb' => 3307 }.fetch(role, 5432) %>
  username: <%= mysql ? 'root' : ENV['DB_USERNAME'] %>
  password: <%= ENV['DB_PASSWORD'] %>
  pool: <%= ENV.fetch('DB_POOL', 5) %>
  schema_dump: <%= role == 'pg' ? 'schema.rb' : "#{role}_schema.rb" %>

development:
  <%= role %>:
    <<: *default
    database: <%= ENV['DB_NAME'] %>

test:
  <%= role %>:
    <<: *default
    database: <%= ENV['DB_NAME'] %>_test
