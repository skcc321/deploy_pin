inherit_from: .rubocop_todo.yml
plugins: rubocop-minitest

AllCops:
  Exclude:
    - lib/deploy_pin/generators/templates/**/*
    - test/dummy/lib/deploy_pin/**/*
    - test/rails/dummy/tmp/**/*
    - test/rails/dummy/lib/deploy_pin/**/*
    - tmp/**/*
  NewCops: disable
  TargetRubyVersion: 3.1

Layout/IndentationConsistency:
  EnforcedStyle: indented_internal_methods

Style/ClassAndModuleChildren:
  EnforcedStyle: nested
  Exclude:
    - test/**/*_test.rb

Metrics/ClassLength:
  Exclude:
    - test/**/*_test.rb

Metrics/BlockLength:
  Exclude:
    - '*.gemspec'
    - lib/tasks/*.rake
    - test/support/*_tests.rb

Metrics/ModuleLength:
  Exclude:
    - test/support/*_tests.rb
